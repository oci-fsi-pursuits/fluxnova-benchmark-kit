name: Reproduce offline checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/ci_secret_scan.py
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install verified k6
        run: python scripts/ci_tools.py
      - name: Unit and real k6 checks
        run: python -m unittest discover -s tests -v
      - name: Benchmark catalogue and guide consistency
        run: |
          python -m benchlib.cli catalog --check
          python scripts/build_benchmark_guide.py --check
      - name: Fresh offline demonstration
        run: python -m benchlib.cli demo --output-root "${{ runner.temp }}/fluxnova-report-demo"
