name: Qualify upstream engine on Java 21 and 25
on:
  workflow_dispatch:
    inputs:
      release:
        description: Pinned Fluxnova source release to qualify
        type: choice
        options: ['3.0.1', '3.1.1']
        default: '3.0.1'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: '21'
            url: https://corretto.aws/downloads/resources/21.0.12.12.1/amazon-corretto-21.0.12.12.1-linux-x64.tar.gz
            sha256: 8785082c2fb999c024c8821e4a7c5391bda28f1667cceadafd78e2965b7669d2
          - java: '25'
            url: https://corretto.aws/downloads/resources/25.0.5.0.10/amazon-corretto-25.0.5.0.10-linux-x64.tar.gz
            sha256: 1d89b4194f20ee513f4dd9fc2aadd038de3c713c37fd444d77566b3da7b0ee65
    env:
      SOURCE_RELEASE: ${{ inputs.release }}
      JAVA_MAJOR: ${{ matrix.java }}
      JAVA_URL: ${{ matrix.url }}
      JAVA_SHA256: ${{ matrix.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the verified JDK archive
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native-jdk" dist/native-compatibility
          curl --fail --location --retry 2 --max-time 300 "$JAVA_URL" -o "$RUNNER_TEMP/native-jdk.tar.gz"
          printf '%s  %s\n' "$JAVA_SHA256" "$RUNNER_TEMP/native-jdk.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/native-jdk.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/native-jdk"
          printf 'JAVA_HOME=%s\n' "$RUNNER_TEMP/native-jdk" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$RUNNER_TEMP/native-jdk" >> "$GITHUB_PATH"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          record = {key: os.environ[key] for key in ('SOURCE_RELEASE', 'JAVA_MAJOR', 'JAVA_URL', 'JAVA_SHA256', 'GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT')}
          record['jdk_archive_sha256_verified'] = True
          record['scope'] = 'Selected engine tests on isolated hosted runners; not OCI performance or upstream Java 25 support.'
          Path('dist/native-compatibility/toolchain.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
      - name: Build and run the bounded H2 benchmark profile
        shell: bash
        run: |
          case "$SOURCE_RELEASE" in
            3.0.1) upstream_sha=c465509aa71f76508274d9f464a2a90f83667525 ;;
            3.1.1) upstream_sha=3ac64ca2c3d7c93f00395e18b9dc3218e5250264 ;;
            *) exit 2 ;;
          esac
          python3 scripts/build_native.py \
            --sha "$upstream_sha" --java-major "$JAVA_MAJOR" \
            --database h2 --history full --threads 2 --runs 100 \
            --command-timeout-seconds 1500 \
            --maven-repository "$RUNNER_TEMP/native-maven-repository" \
            --workspace "$RUNNER_TEMP/native-source" \
            --output-dir dist/native-compatibility/native
      - name: Retain successful and failed attempt evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ inputs.release }}-java${{ matrix.java }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/native-compatibility/
          if-no-files-found: error
          retention-days: 30
