title = "Fluxnova benchmark examples and secret scanning"

# Historical test dict syntax put this public header name after a token-key
# variable. Only the exact header name in this one test file is non-secret.
[[allowlists]]
description = "Literal numeric-correlation header name in transport tests"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''(^|/)tests/test_transport_diagnostics\.py$''']
regexes = ['''^X-Fnv07-Diagnostic-Id$''']

[extend]
useDefault = true

# Match both a named example path AND the exact non-secret value. Other values
# in these same files remain subject to every default detection rule.
[[allowlists]]
description = "Explicit example Vault identifiers"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''(^|/)(deploy/verifier\.config\.example\.json|infra/oci-reference/terraform\.tfvars\.example|tests/test_recovery_bundle\.py)$''']
regexes = ['''^ocid1\.vaultsecret\.(REPLACE|oc1\.test)$''']

[[allowlists]]
description = "Terraform enum selecting a Vault reference"
targetRules = ["hashicorp-tf-password"]
condition = "AND"
regexTarget = "match"
paths = ['''(^|/)infra/oci-reference/(main\.tf|tests/reference\.tftest\.hcl)$''']
regexes = ['''^\.?password_type\s*(=|==)\s*"VAULT_SECRET"\s*$''']
